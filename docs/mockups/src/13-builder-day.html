<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Builder, day editor</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone">
<div class="body tight">
  <div class="nav"><div class="ib" data-i="back"></div><div class="row" style="gap:0"><span class="bodyStrong accent" style="padding-right:12px">Save</span></div></div>
  <div class="stack" style="gap:2px"><span class="label">Push Pull Legs (mine)</span><span class="title">Day A</span></div>
  <div class="card" style="padding:14px 16px"><div class="row"><span data-i="grip" style="color:var(--muted)"></span><div data-p="bar" class="sm"></div><div class="tx grow"><span class="bodyStrong">Barbell squat</span><span class="callout muted">2×5+ · AMRAP</span></div><span data-i="chev" data-s="sm" style="color:var(--muted)"></span></div></div>
  <div style="border-left:4px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:8px">
    <div class="row between"><span class="label accent">Superset · rest 90 s</span><span class="callout accent bodyStrong">Ungroup</span></div>
    <div class="card" style="padding:14px 16px"><div class="row"><span class="pill">A1</span><div class="tx grow"><span class="bodyStrong">Pull-up ladder</span><span class="callout muted">3×5-8 · ladder</span></div></div></div>
    <div class="card" style="padding:14px 16px"><div class="row"><span class="pill">A2</span><div class="tx grow"><span class="bodyStrong">Dip ladder</span><span class="callout muted">3×5-8</span></div><span class="callout muted">Edit</span></div>
      <div class="stack" style="margin-top:12px;gap:8px"><span class="label">Progression</span><div class="seg"><div>AMRAP</div><div>Linear</div><div>Double</div><div class="on">Ladder</div></div>
      <div class="field" style="min-height:48px;color:var(--text)"><span data-i="ladder" data-s="sm" class="accent"></span><span class="grow">Dip ladder</span><span data-i="down" data-s="sm" style="color:var(--muted)"></span></div></div></div>
  </div>
  <div class="row" style="gap:10px"><div class="btn sm grow"><span data-i="plus" data-s="sm"></span>Add exercise</div><div class="btn sm grow">Group selected</div></div>
</div>
</main><script src="base.js"></script></body></html>
