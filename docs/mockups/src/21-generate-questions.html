<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Generate a program, questions</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone">
<div class="body tight" style="gap:14px">
  <div class="nav"><div class="ib" data-i="back"></div><div class="row" style="gap:0"><span class="callout muted" style="padding-right:12px">1 of 1</span></div></div>
  <span class="title">Build me a program</span>
  <div class="stack" style="gap:8px"><span class="label">Goal</span><div class="chips sm"><span class="chip">Strength</span><span class="chip">Muscle</span><span class="chip on">Calisthenics skills</span><span class="chip">General fitness</span><span class="chip">Mobility</span></div></div>
  <div class="stack" style="gap:8px"><span class="label">Days a week</span><div class="chips sm"><span class="chip" style="min-width:44px;padding:0;width:44px">1</span><span class="chip" style="min-width:44px;padding:0;width:44px">2</span><span class="chip on" style="min-width:44px;padding:0;width:44px">3</span><span class="chip" style="min-width:44px;padding:0;width:44px">4</span><span class="chip" style="min-width:44px;padding:0;width:44px">5</span><span class="chip" style="min-width:44px;padding:0;width:44px">6</span><span class="chip" style="min-width:44px;padding:0;width:44px">7</span></div></div>
  <div class="stack" style="gap:8px"><span class="label">Session length</span><div class="chips sm"><span class="chip">30 min</span><span class="chip on">45 min</span><span class="chip">60 min</span><span class="chip">90 min</span></div></div>
  <div class="stack" style="gap:8px"><span class="label">Equipment</span><div class="chips sm"><span class="chip on"><span data-i="check" data-s="sm"></span>Pull-up bar</span><span class="chip on"><span data-i="check" data-s="sm"></span>Rings</span><span class="chip">Barbell</span><span class="chip">Bands</span></div></div>
  <div class="stack" style="gap:8px"><span class="label">Experience</span><div class="chips sm"><span class="chip">New</span><span class="chip on">6+ months</span><span class="chip">2+ years</span></div></div>
  <div class="row"><span data-i="sparkle" data-s="sm" class="accent"></span><span class="bodyStrong accent grow">Describe it instead</span><span data-i="chev" data-s="sm" style="color:var(--muted)"></span></div>
</div>
<div class="actions"><div class="btn primary lg">See recommendations</div></div>
</main><script src="base.js"></script></body></html>
