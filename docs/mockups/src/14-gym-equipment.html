<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Gym equipment</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone">
<div class="body tight">
  <div class="nav"><div class="ib" data-i="back"></div><div class="row" style="gap:0"></div></div>
  <span class="title">Your gym</span>
  <div class="card flush"><div class="li" style="min-height:48px;padding:8px 0"><span class="check on" data-i="check" data-s="sm"></span><div class="tx"><span class="bodyStrong">Barbell and plates</span></div></div><div class="li" style="min-height:48px;padding:8px 0"><span class="check on" data-i="check" data-s="sm"></span><div class="tx"><span class="bodyStrong">Pull-up bar</span></div></div><div class="li" style="min-height:48px;padding:8px 0"><span class="check" data-i="close" data-s="sm"></span><div class="tx"><span class="bodyStrong">Rings</span></div></div><div class="li" style="min-height:48px;padding:8px 0"><span class="check on" data-i="check" data-s="sm"></span><div class="tx"><span class="bodyStrong">Dip belt</span></div></div></div>
  <div class="stack"><div class="row between"><span class="label">Resistance bands</span><span class="callout accent bodyStrong">Add band</span></div><div class="card flush"><div class="li" style="min-height:48px;padding:8px 0"><span style="width:22px;height:22px;border-radius:50%;background:#E5484D"></span><div class="tx"><span class="bodyStrong">Red</span><span class="callout muted">Medium assist</span></div><span data-i="grip" style="color:var(--muted)"></span></div><div class="li" style="min-height:48px;padding:8px 0"><span style="width:22px;height:22px;border-radius:50%;background:#3B82F6"></span><div class="tx"><span class="bodyStrong">Blue</span><span class="callout muted">Heavy assist</span></div><span data-i="grip" style="color:var(--muted)"></span></div></div></div>
  <div class="stack"><span class="label">Kettlebells</span><div class="chips"><span class="chip">8 kg</span><span class="chip on">12 kg</span><span class="chip on">16 kg</span><span class="chip on">24 kg</span><span class="chip">+ Add</span></div></div>
  <div class="card flush"><div class="li"><div class="tx"><span class="bodyStrong">Ease back after a break</span><span class="callout muted">Lower weights after 2 weeks away</span></div><span class="sw on"></span></div></div>
</div>
</main><script src="base.js"></script></body></html>
