<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Finish or discard dialog</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone" data-tabs="today">
<div class="body tight" style="filter:none">
  <div class="stack" style="gap:4px"><span class="label">Wednesday, 23 November</span><span class="title">Today</span></div>
  <div class="card" style="border:2px solid var(--accent)"><div class="headline">GSLP · Day 2</div><div class="callout muted">Started 18 min ago · 3 of 6 sets</div></div>
  <div class="card"><div class="headline">Skill Track</div><div class="callout muted">Next: Day A · Week 3</div><div class="btn sm" style="margin-top:12px;background:var(--surface);border:1px solid var(--border)">Start</div></div>
</div>
<div class="scrim"></div>
<div class="dialog"><span class="headline">Finish or discard the current workout?</span>
  <span class="callout muted">GSLP · Day 2 is still open with 3 sets logged. Close it before starting Skill Track.</span>
  <div class="stack" style="gap:8px"><div class="btn primary">Resume it</div><div class="btn danger">Discard it</div><div class="btn plain">Cancel</div></div></div>
</main><script src="base.js"></script></body></html>
