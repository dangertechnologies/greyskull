<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Interval timer, work phase</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone">
<div class="body tight">
  <div class="nav"><div class="ib" data-i="back"></div><div class="row" style="gap:0"><span class="callout muted" style="padding-right:12px">20 s / 10 s</span></div></div>
  <div class="stack" style="gap:2px;align-items:center;text-align:center"><span class="label">Round 3 of 8</span><span class="headline">Jump squat</span></div>
  <div class="stack" style="align-items:center;gap:4px"><span class="pill" style="height:32px;font-size:15px;padding:0 18px">WORK</span></div>
  <div style="position:relative;width:240px;height:240px;align-self:center"><svg width="240" height="240" viewBox="0 0 240 240" style="transform:rotate(-90deg)"><circle cx="120.0" cy="120.0" r="110" fill="none" style="stroke:var(--border)" stroke-width="10"/><circle cx="120.0" cy="120.0" r="110" fill="none" style="stroke:var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="484 691"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="display">0:14</span></div></div>
  <div class="row" style="gap:6px;justify-content:center"><span style="width:22px;height:8px;border-radius:4px;background:var(--accent)"></span><span style="width:22px;height:8px;border-radius:4px;background:var(--accent)"></span><span style="width:22px;height:8px;border-radius:4px;background:var(--text)"></span><span style="width:22px;height:8px;border-radius:4px;background:var(--border)"></span><span style="width:22px;height:8px;border-radius:4px;background:var(--border)"></span><span style="width:22px;height:8px;border-radius:4px;background:var(--border)"></span><span style="width:22px;height:8px;border-radius:4px;background:var(--border)"></span><span style="width:22px;height:8px;border-radius:4px;background:var(--border)"></span></div>
  <div class="card"><div class="row"><span class="label">Next</span><span class="grow"></span><span class="bodyStrong">Rest 10 s</span><span class="callout muted">then round 4</span></div></div>
</div>
<div class="actions"><div class="row" style="gap:8px"><div class="btn grow"><span data-i="pause" data-s="sm"></span>Pause</div><div class="btn grow"><span data-i="skip" data-s="sm"></span>Skip</div></div><div class="btn plain danger" style="color:var(--danger)">End early</div></div>
</main><script src="base.js"></script></body></html>
