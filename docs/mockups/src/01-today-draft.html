<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Today with an open draft</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone" data-tabs="today">
<div class="body tight">
  <div class="stack" style="gap:4px"><span class="label">Wednesday, 23 November</span><span class="title">Today</span></div>

  <div class="stack">
    <div class="card" style="border:2px solid var(--accent)">
      <div class="row between"><div><div class="headline">GSLP · Day 2</div><div class="callout muted">Started 18 min ago · 3 of 6 sets</div></div><span class="pill">Draft</span></div>
      <div class="btn primary" style="margin-top:14px">Resume workout</div>
    </div>
  </div>

  <div class="stack">
    <div class="card">
      <div class="row between"><div><div class="headline">GSLP</div><div class="callout muted">Next: Day 3 · Week 14</div></div><span class="pill muted">Strength</span></div>
      <div class="row" style="margin-top:12px"><div data-p="bar" class="sm"></div><div data-p="squat" class="sm"></div><span class="grow"></span><div class="btn sm" style="background:var(--surface);border:1px solid var(--border)">Start</div><div class="btn sm plain" style="padding:0 8px">Skip</div></div>
    </div>
    <div class="card">
      <div class="row between"><div><div class="headline">Skill Track</div><div class="callout muted">Next: Day A · Week 3</div></div><span class="pill muted">Skills</span></div>
      <div class="row" style="margin-top:12px"><div data-p="hand" class="sm"></div><div data-p="lever" class="sm"></div><span class="grow"></span><div class="btn sm" style="background:var(--surface);border:1px solid var(--border)">Start</div><div class="btn sm plain" style="padding:0 8px">Skip</div></div>
    </div>
  </div>

  <div class="stack">
    <span class="label">Paused</span>
    <div class="card flush"><div class="li"><div class="tx"><span class="bodyStrong">5/3/1</span><span class="callout muted">Paused 12 Nov · Day 2 next</span></div><span class="accent bodyStrong">Resume</span></div></div>
  </div>
</div>
</main><script src="base.js"></script></body></html>
