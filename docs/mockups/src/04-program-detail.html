<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Program detail</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone">
<div class="body tight">
  <div class="nav"><div class="ib" data-i="back"></div><div class="row" style="gap:0"><div class="ib" data-i="edit"></div></div></div>
  <div class="stack" style="gap:6px"><div class="row"><span class="pill muted">Skills</span><span class="pill ok">Active</span></div><span class="title">Skill Track</span><span class="callout muted">Three days a week, built to run beside another program.</span></div>
  <div class="card"><div class="row between"><div><span class="label">Next</span><div class="headline">Day A · Week 3</div></div><div class="btn sm primary">Start</div></div></div>
  <div class="stack"><span class="label">Days</span><div class="card flush">
    <div class="li"><div data-p="hand" class="sm"></div><div class="tx"><span class="bodyStrong">Day A</span><span class="callout muted">Handstand · Front lever · L-sit</span></div><span data-i="chev" data-s="sm" style="color:var(--muted)"></span></div><div class="li"><div data-p="plank" class="sm"></div><div class="tx"><span class="bodyStrong">Day B</span><span class="callout muted">Planche · Muscle-up</span></div><span data-i="chev" data-s="sm" style="color:var(--muted)"></span></div></div></div>
  <div class="stack"><span class="label">Rules</span><div class="card flush">
    <div class="li"><div class="tx"><span class="bodyStrong">Ladders</span><span class="callout muted">Hit the top of the range to move up a step</span></div></div></div></div>
  <div class="stack" style="gap:0"><div class="btn plain" style="justify-content:flex-start;padding:0 4px">Pause program</div><div class="btn plain" style="justify-content:flex-start;padding:0 4px;color:var(--danger)">Remove program</div></div>
</div>
</main><script src="base.js"></script></body></html>
