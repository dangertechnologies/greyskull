<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Settings, Siri tile</title><link rel="stylesheet" href="base.css"></head><body>
<main class="phone" data-tabs="settings">
<div class="body tight">
  <span class="title">Settings</span>
  <div class="card flush"><div class="li"><div class="tx"><span class="bodyStrong">Units</span></div><span class="val num">kg</span></div><div class="li"><div class="tx"><span class="bodyStrong">Rest timer</span></div><span class="val num">2 min</span></div><div class="li"><div class="tx"><span class="bodyStrong">Apple Health</span></div><span class="val num">On</span><span data-i="chev" data-s="sm" style="color:var(--muted)"></span></div></div>
  <div class="stack"><span class="label">Siri and Shortcuts</span>
    <div class="card"><div class="row" style="align-items:flex-start"><div class="badge sm" data-i="siri" data-s="sm"></div><div class="tx"><span class="bodyStrong">Ask Siri about your workout</span><span class="callout muted">Say these, or add them to Shortcuts.</span></div></div>
      <div class="stack" style="gap:8px;margin-top:14px">
        <div class="row" style="background:var(--bg);border-radius:12px;padding:10px 14px"><span class="callout grow">"What's my next workout in Greyskull?"</span></div>
        <div class="row" style="background:var(--bg);border-radius:12px;padding:10px 14px"><span class="callout grow">"Start my workout in Greyskull"</span></div>
        <div class="row" style="background:var(--bg);border-radius:12px;padding:10px 14px"><span class="callout grow">"Make me a program in Greyskull"</span></div>
      </div>
      <div class="btn sm" style="margin-top:14px;background:var(--bg)">Open in Shortcuts<span data-i="chev" data-s="sm"></span></div></div></div>
  <div class="card flush"><div class="li"><div class="tx"><span class="bodyStrong">Credits</span></div><span data-i="chev" data-s="sm" style="color:var(--muted)"></span></div></div>
</div>
</main><script src="base.js"></script></body></html>
